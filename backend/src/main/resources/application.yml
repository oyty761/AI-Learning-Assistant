server:
  port: 8080

spring:
  application:
    name: learning-assistant
  
  # 使用H2内存数据库，无需安装MySQL
  datasource:
    url: jdbc:h2:file:./data/learning_assistant;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # H2控制台（开发调试使用）
  h2:
    console:
      enabled: true
      path: /h2-console
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB

# AI Service Configuration
# ChatECNU API Configuration (华东师大AI平台)
# 请通过环境变量 AI_ECNU_API_KEY 设置API密钥，或创建 application-local.yml 配置
ai:
  ecnu:
    api-key: ${AI_ECNU_API_KEY:}
    base-url: https://chat.ecnu.edu.cn/open/api/v1
    model: ChatECNU

# File Upload Configuration
upload:
  # 使用绝对路径避免Windows路径问题
  # Windows示例: D:/uploads/ 或 D:\\uploads\\
  # Linux/Mac示例: /var/uploads/
  path: ${UPLOAD_PATH:./uploads/}

# Logging
logging:
  level:
    com.example.app: DEBUG
    org.springframework.web: INFO
