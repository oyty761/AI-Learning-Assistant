version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: learning-assistant-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: learning_assistant
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - learning-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learning-assistant-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/learning_assistant?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      BAIDU_API_KEY: ${BAIDU_API_KEY}
      BAIDU_SECRET_KEY: ${BAIDU_SECRET_KEY}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - mysql
    networks:
      - learning-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learning-assistant-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - learning-network

volumes:
  mysql_data:

networks:
  learning-network:
    driver: bridge
